openapi: 3.0.3
info:
  title: AFDE - API administrativa
  version: 1.0.0
  description: API protegida para gerenciamento de contas administrativas e usuários comuns.
servers:
  - url: http://127.0.0.1:5001
    description: API Flask local
  - url: http://localhost:5001
    description: API Flask local via localhost
tags:
  - name: Contas administrativas
    description: CRUD de contas da tabela usuarios
paths:
  /api/admin/users:
    get:
      tags: [Contas administrativas]
      operationId: listarContas
      summary: Listar contas
      description: Retorna administradores e usuários comuns. Use tipo e busca para filtrar.
      security: [{ AdminBearer: [] }]
      parameters:
        - in: query
          name: tipo
          schema: { type: string, enum: [admin, usuario] }
          description: Filtra pelo tipo da conta.
        - in: query
          name: busca
          schema: { type: string, maxLength: 190 }
          description: Pesquisa por nome ou e-mail.
      responses:
        '200':
          description: Contas encontradas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { description: Banco de dados indisponível. }
    post:
      tags: [Contas administrativas]
      operationId: criarConta
      summary: Criar conta
      description: Cria uma conta admin ou usuário comum com senha bcrypt compatível com o login PHP.
      security: [{ AdminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountInput' }
      responses:
        '201':
          description: Conta criada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: E-mail já cadastrado. }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/admin/users/{userId}:
    parameters:
      - in: path
        name: userId
        required: true
        schema: { type: integer, minimum: 1 }
    put:
      tags: [Contas administrativas]
      operationId: atualizarConta
      summary: Atualizar conta
      description: Atualiza os campos enviados. A senha é opcional e, quando enviada, é substituída.
      security: [{ AdminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountUpdate' }
      responses:
        '200':
          description: Conta atualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Conta não encontrada. }
        '409': { description: E-mail já cadastrado. }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [Contas administrativas]
      operationId: excluirConta
      summary: Excluir conta
      description: Exclui uma conta. Por segurança, o administrador não pode excluir a própria conta.
      security: [{ AdminBearer: [] }]
      responses:
        '200': { description: Conta excluída com sucesso. }
        '400': { description: Tentativa de excluir a própria conta. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Conta não encontrada. }
        '409': { description: A conta possui dados relacionados e não pode ser removida. }
        '429': { $ref: '#/components/responses/RateLimited' }
components:
  securitySchemes:
    AdminBearer:
      type: http
      scheme: bearer
      bearerFormat: HMAC
      description: Token HMAC de curta duração emitido pela página PHP para um administrador autenticado.
  schemas:
    Account:
      type: object
      required: [id, nome, email, tipo]
      properties:
        id: { type: integer, example: 12 }
        nome: { type: string, example: Maria Silva }
        email: { type: string, format: email, example: maria@example.com }
        telefone: { type: string, example: '(11) 99999-9999' }
        provedor: { type: string, example: local }
        tipo: { type: string, enum: [admin, usuario] }
        data_criacao: { type: string, format: date-time }
    AccountInput:
      type: object
      required: [nome, email, tipo, senha]
      properties:
        nome: { type: string, minLength: 2, maxLength: 255 }
        email: { type: string, format: email, maxLength: 190 }
        telefone: { type: string, maxLength: 25 }
        tipo: { type: string, enum: [admin, usuario] }
        senha: { type: string, format: password, minLength: 8 }
    AccountUpdate:
      type: object
      minProperties: 1
      properties:
        nome: { type: string, minLength: 2, maxLength: 255 }
        email: { type: string, format: email, maxLength: 190 }
        telefone: { type: string, maxLength: 25 }
        tipo: { type: string, enum: [admin, usuario] }
        senha: { type: string, format: password, minLength: 8 }
    AccountResponse:
      type: object
      properties:
        ok: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/Account' }
    AccountsResponse:
      type: object
      properties:
        ok: { type: boolean, example: true }
        data: { type: array, items: { $ref: '#/components/schemas/Account' } }
  responses:
    BadRequest:
      description: Dados inválidos.
    Unauthorized:
      description: Token ausente, inválido ou expirado.
    Forbidden:
      description: Permissão administrativa revogada.
    RateLimited:
      description: Muitas solicitações; tente novamente em instantes.
