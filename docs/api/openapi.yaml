openapi: 3.0.3
info:
  title: PTCC Educação Financeira - API própria
  version: 1.0.0
  description: |
    Documentação dos endpoints HTTP/JSON implementados pelo projeto.
    Os endpoints dependem de sessão PHP autenticada, banco MySQL e, no módulo
    Open Finance, credenciais da Pluggy. Não inclui diretamente as APIs da
    Pluggy, Asaas, Google, Gemini ou Brapi.
servers:
  - url: http://localhost/PTCC-EducacaoFinanceira
    description: XAMPP/Apache (ajuste o caminho conforme a pasta htdocs)
  - url: http://127.0.0.1/PTCC-EducacaoFinanceira
    description: XAMPP/Apache via loopback
tags:
  - name: Open Finance
  - name: Carteira e calendário
  - name: Arena
  - name: Comunidade
  - name: Administradores
  - name: Usuários comuns
paths:
  /api/users:
    servers:
      - url: http://127.0.0.1:5001
        description: API Flask local
      - url: http://localhost:5001
        description: API Flask local via localhost
    get:
      tags: [Usuários comuns]
      summary: Lista os usuários comuns
      description: Retorna somente contas com tipo `usuario`; administradores nunca são retornados.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Lista de usuários comuns
          content:
            application/json: { schema: { $ref: '#/components/schemas/UserListResponse' } }
        '401': { description: Token ausente, inválido ou expirado }
        '503': { description: Banco de dados indisponível }
    post:
      tags: [Usuários comuns]
      summary: Cria um usuário comum
      description: Cria a conta forçando `tipo=usuario`, sem acesso administrativo.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminInput' }
      responses:
        '201':
          description: Usuário criado
          content:
            application/json: { schema: { $ref: '#/components/schemas/UserResponse' } }
        '400': { description: Dados inválidos }
        '409': { description: E-mail já cadastrado }
        '401': { description: Token ausente, inválido ou expirado }
  /api/users/{id}:
    servers:
      - url: http://127.0.0.1:5001
        description: API Flask local
      - url: http://localhost:5001
        description: API Flask local via localhost
    put:
      tags: [Usuários comuns]
      summary: Edita um usuário comum
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1, example: 12 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUpdateInput' }
      responses:
        '200':
          description: Usuário atualizado
          content:
            application/json: { schema: { $ref: '#/components/schemas/UserResponse' } }
        '400': { description: Dados inválidos }
        '404': { description: Usuário comum não encontrado }
        '409': { description: E-mail já cadastrado }
        '401': { description: Token ausente, inválido ou expirado }
    delete:
      tags: [Usuários comuns]
      summary: Exclui um usuário comum
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1, example: 12 }
      responses:
        '200': { description: Usuário excluído }
        '404': { description: Usuário comum não encontrado }
        '401': { description: Token ausente, inválido ou expirado }
        '503': { description: Banco de dados indisponível }
  /api/admins:
    servers:
      - url: http://127.0.0.1:5001
        description: API Flask local
      - url: http://localhost:5001
        description: API Flask local via localhost
    get:
      tags: [Administradores]
      summary: Lista os perfis de administrador
      description: Retorna somente contas com tipo `admin`. Requer token Bearer emitido pelo painel administrativo.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Lista de administradores
          content:
            application/json: { schema: { $ref: '#/components/schemas/AdminListResponse' } }
        '401': { description: Token ausente, inválido ou expirado }
        '503': { description: Banco de dados indisponível }
    post:
      tags: [Administradores]
      summary: Cria um perfil de administrador
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminInput' }
      responses:
        '201':
          description: Administrador criado
          content:
            application/json: { schema: { $ref: '#/components/schemas/AdminResponse' } }
        '400': { description: Dados inválidos }
        '409': { description: E-mail já cadastrado }
        '401': { description: Token ausente, inválido ou expirado }
  /api/admins/{id}:
    servers:
      - url: http://127.0.0.1:5001
        description: API Flask local
      - url: http://localhost:5001
        description: API Flask local via localhost
    put:
      tags: [Administradores]
      summary: Edita um perfil de administrador
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1, example: 3 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUpdateInput' }
      responses:
        '200':
          description: Administrador atualizado
          content:
            application/json: { schema: { $ref: '#/components/schemas/AdminResponse' } }
        '400': { description: Dados inválidos }
        '404': { description: Administrador não encontrado }
        '409': { description: E-mail já cadastrado }
        '401': { description: Token ausente, inválido ou expirado }
    delete:
      tags: [Administradores]
      summary: Exclui um perfil de administrador
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1, example: 3 }
      responses:
        '200': { description: Administrador excluído }
        '400': { description: Não é permitido excluir a própria conta }
        '404': { description: Administrador não encontrado }
        '409': { description: É necessário manter pelo menos um administrador }
        '401': { description: Token ausente, inválido ou expirado }
        '503': { description: Banco de dados indisponível }
  /open-finance/dados.php:
    get:
      tags: [Open Finance]
      summary: Retorna dados Open Finance persistidos e, por padrão, sincroniza
      parameters:
        - in: query
          name: sync
          schema: { type: integer, enum: [0, 1], default: 1 }
          description: Use 0 para não disparar sincronização externa.
      responses:
        '200':
          description: Dados da conta, transações, empréstimos e investimentos
          content:
            application/json: { schema: { $ref: '#/components/schemas/OpenFinanceData' } }
        '401': { description: Sessão não autenticada }
        '500': { description: Erro interno }
  /open-finance/transacoes.php:
    get:
      tags: [Open Finance]
      summary: Consulta e persiste as transações da conta conectada
      responses:
        '200':
          description: Lista de transações
          content:
            application/json: { schema: { $ref: '#/components/schemas/TransactionsResponse' } }
        '401': { description: Sessão não autenticada }
        '503': { description: Pluggy não configurada ou indisponível }
  /open-finance/connect-token.php:
    post:
      tags: [Open Finance]
      summary: Cria um token de conexão para o widget de Open Finance
      responses:
        '200': { description: Token criado }
        '401': { description: Sessão não autenticada }
        '503': { description: Pluggy não configurada }
  /open-finance/classificar.php:
    post:
      tags: [Open Finance]
      summary: Altera manualmente a categoria de uma transação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transacaoId, categoria]
              properties:
                transacaoId: { type: string, example: 'transaction-id' }
                categoria: { type: string, example: Alimentação }
      responses:
        '200': { description: Categoria salva }
        '400': { description: Dados inválidos }
        '401': { description: Sessão não autenticada }
        '403': { description: CSRF inválido }
        '404': { description: Transação não encontrada }
  /open-finance/sincronizar.php:
    post:
      tags: [Open Finance]
      summary: Solicita sincronização dos dados Open Finance
      responses:
        '200': { description: Sincronização concluída }
        '401': { description: Sessão não autenticada }
  /open-finance/item.php:
    post:
      tags: [Open Finance]
      summary: Salva ou remove a associação da conta conectada do usuário
      responses:
        '200': { description: Operação concluída }
        '400': { description: Item inválido }
        '401': { description: Sessão não autenticada }
  /back-end/dados_grafico.php:
    get:
      tags: [Carteira e calendário]
      summary: Retorna movimentações de um mês para o gráfico/calendário
      parameters:
        - in: query
          name: mes
          required: true
          schema: { type: integer, minimum: 1, maximum: 12, example: 10 }
        - in: query
          name: ano
          required: true
          schema: { type: integer, example: 2026 }
      responses:
        '200': { description: Dados mensais em JSON }
        '400': { description: Mês ou ano inválido }
        '401': { description: Sessão não autenticada }
  /back-end/dados_historico.php:
    get:
      tags: [Carteira e calendário]
      summary: Retorna o histórico financeiro do usuário
      responses:
        '200': { description: Histórico em JSON }
        '401': { description: Sessão não autenticada }
  /back-end/aprendizado_api.php:
    post:
      tags: [Arena]
      summary: Executa ações da Arena de aprendizado
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: true
              description: Os campos variam conforme a ação da Arena.
      responses:
        '200': { description: Resultado da ação em JSON }
        '401': { description: Sessão não autenticada }
        '403': { description: CSRF inválido }
  /back-end/pular_teste.php:
    post:
      tags: [Arena]
      summary: Pula o teste diagnóstico e define a patente inicial
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties: { csrf_token: { type: string } }
      responses:
        '200': { description: Operação concluída }
        '401': { description: Sessão não autenticada }
        '403': { description: CSRF inválido }
  /community/back-end/api.php:
    post:
      tags: [Comunidade]
      summary: API de ações da comunidade
      description: Endpoint multiplexado; a ação é enviada no corpo da requisição.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, example: feed }
              additionalProperties: true
      responses:
        '200': { description: Resultado da ação em JSON }
        '401': { description: Sessão não autenticada }
        '403': { description: CSRF inválido }
  /back-end/processa_movimentacao.php:
    post:
      tags: [Carteira e calendário]
      summary: Cria ou processa uma movimentação manual
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200': { description: Operação concluída }
        '401': { description: Sessão não autenticada }
        '403': { description: CSRF inválido }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: HMAC
  schemas:
    AdminInput:
      type: object
      required: [nome, email, senha]
      properties:
        nome: { type: string, minLength: 2, maxLength: 120, example: 'Ana Administradora' }
        email: { type: string, format: email, example: 'ana@exemplo.com' }
        telefone: { type: string, maxLength: 30, example: '(11) 99999-9999' }
        senha: { type: string, format: password, minLength: 8, maxLength: 72, example: 'SenhaSegura123' }
    AdminUpdateInput:
      type: object
      required: [nome, email]
      properties:
        nome: { type: string, minLength: 2, maxLength: 120, example: 'Ana Administradora' }
        email: { type: string, format: email, example: 'ana@exemplo.com' }
        telefone: { type: string, maxLength: 30, example: '(11) 99999-9999' }
        senha: { type: string, format: password, minLength: 8, maxLength: 72, description: Opcional na edição }
    AdminProfile:
      type: object
      properties:
        id: { type: integer, example: 3 }
        nome: { type: string, example: 'Ana Administradora' }
        email: { type: string, format: email, example: 'ana@exemplo.com' }
        telefone: { type: string, example: '(11) 99999-9999' }
        provedor: { type: string, example: local }
        tipo: { type: string, enum: [admin], example: admin }
        data_criacao: { type: string, format: date-time }
    AdminResponse:
      type: object
      properties:
        mensagem: { type: string }
        dado: { $ref: '#/components/schemas/AdminProfile' }
    AdminListResponse:
      type: object
      properties:
        dados:
          type: array
          items: { $ref: '#/components/schemas/AdminProfile' }
    UserResponse:
      type: object
      properties:
        mensagem: { type: string }
        dado: { $ref: '#/components/schemas/UserProfile' }
    UserListResponse:
      type: object
      properties:
        dados:
          type: array
          items: { $ref: '#/components/schemas/UserProfile' }
    UserProfile:
      type: object
      properties:
        id: { type: integer, example: 12 }
        nome: { type: string, example: 'Bryan Soares' }
        email: { type: string, format: email, example: 'soares@gmail.com' }
        telefone: { type: string, example: '(11) 99999-9999' }
        provedor: { type: string, example: local }
        tipo: { type: string, enum: [usuario], example: usuario }
        data_criacao: { type: string, format: date-time }
    OpenFinanceData:
      type: object
      properties:
        connected: { type: boolean }
        transacoes: { type: array, items: { type: object } }
        emprestimos: { type: array, items: { type: object } }
        investimentos: { type: array, items: { type: object } }
        sincronizado: { type: integer }
        avisos: { type: array, items: { type: string } }
    TransactionsResponse:
      type: object
      properties:
        connected: { type: boolean }
        transacoes: { type: array, items: { type: object } }
        sincronizado: { type: integer }
        avisos: { type: array, items: { type: string } }




